name: One-time import audited R1D snapshot

on:
  push:
    branches:
      - governance/parity-reconciliation-20261102
    paths:
      - .github/workflows/import-r1d-snapshot.yml

permissions:
  contents: write

jobs:
  import-r1d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download and verify R1D snapshot; copy only approved documents
        env:
          SNAPSHOT_URL: https://preview-chat-bdf10873-7803-4338-b2cf-19eb3b2301a4.space-z.ai/api/download/snapshot
          EXPECTED_SHA256: 9d36098e159e96eda563c69b432882dc8379a66eff81c81b3c1c07d226e0665f
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SNAPSHOT_URL" -o "$RUNNER_TEMP/r1d.zip"
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/r1d.zip" | sha256sum --check -
          python3 - "$RUNNER_TEMP/r1d.zip" <<'PY'
          import hashlib, pathlib, stat, sys, zipfile

          archive = pathlib.Path(sys.argv[1])
          docs = [
              "AUTHORIZATION_MODEL.md",
              "CONTROL_REFERENCE_CROSSWALK.md",
              "DATA_MODEL_CONCEPT.md",
              "ENTITLEMENT_MODEL.md",
              "OBSOLETE_AND_SUPERSEDED_REGISTER.md",
              "OPEN_DECISIONS.md",
              "PERSONAS_AND_JOURNEYS.md",
              "PHASE_2_TRACEABILITY.md",
              "PHASE_5_REPORT.md",
              "PHASE_5_TRACEABILITY.md",
              "PROCESS_MAP.md",
              "PRODUCT_SCOPE.md",
              "README.md",
              "REQUIREMENTS.md",
              "TESTING.md",
              "TRACEABILITY_MATRIX.md",
              "USE_CASES.md",
              "worklog.md",
          ]
          metadata = ["SNAPSHOT_REPORT.md", "MANIFEST.txt", "SHA256SUMS.txt"]
          expected = set(docs + metadata)

          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              names = [i.filename for i in infos]
              if len(names) != 21 or set(names) != expected:
                  raise SystemExit(f"Unexpected ZIP entries: count={len(names)}, names={names}")
              if any(i.is_dir() or "/" in i.filename or "\\" in i.filename for i in infos):
                  raise SystemExit("Nested paths/directories are prohibited")
              for info in infos:
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink entry prohibited: {info.filename}")
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")

              sums = zf.read("SHA256SUMS.txt").decode("utf-8").splitlines()
              if len(sums) != 20:
                  raise SystemExit(f"Expected 20 checksum records, found {len(sums)}")
              checked = set()
              for row in sums:
                  digest, name = row.split(None, 1)
                  name = name.lstrip("*").strip()
                  if name not in docs + ["SNAPSHOT_REPORT.md", "MANIFEST.txt"]:
                      raise SystemExit(f"Unexpected checksum target: {name}")
                  if name in checked:
                      raise SystemExit(f"Duplicate checksum target: {name}")
                  actual = hashlib.sha256(zf.read(name)).hexdigest()
                  if digest != actual:
                      raise SystemExit(f"Checksum mismatch: {name}")
                  checked.add(name)
              if checked != set(docs + ["SNAPSHOT_REPORT.md", "MANIFEST.txt"]):
                  raise SystemExit("Checksum manifest coverage is incomplete")

              for name in docs:
                  pathlib.Path(name).write_bytes(zf.read(name))
          print("R1D archive verified: 21 entries; 20/20 checksums; 18 allowlisted documents extracted.")
          PY

      - name: Commit only the 18 audited documents and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- AUTHORIZATION_MODEL.md CONTROL_REFERENCE_CROSSWALK.md DATA_MODEL_CONCEPT.md ENTITLEMENT_MODEL.md OBSOLETE_AND_SUPERSEDED_REGISTER.md OPEN_DECISIONS.md PERSONAS_AND_JOURNEYS.md PHASE_2_TRACEABILITY.md PHASE_5_REPORT.md PHASE_5_TRACEABILITY.md PROCESS_MAP.md PRODUCT_SCOPE.md README.md REQUIREMENTS.md TESTING.md TRACEABILITY_MATRIX.md USE_CASES.md worklog.md
          git rm -- .github/workflows/import-r1d-snapshot.yml
          git diff --cached --check
          git commit -m "docs(governance): import audited R1D control documents"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
